title: Certutil used to download a file
id: 5d1e9b9c-2f3a-4c52-9a43-6f7a2b1c0d11
status: stable
description: Detects certutil.exe fetching a remote file with the -urlcache switch.
author: detection-dojo fixtures
date: 2025/01/01
tags:
  - attack.command-and-control
  - attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    - Image|endswith: '\certutil.exe'
    - OriginalFileName: 'CertUtil.exe'
  selection_urlcache:
    CommandLine|contains:
      - '-urlcache'
      - '/urlcache'
  selection_url:
    CommandLine|contains: 'http'
  condition: all of selection_*
falsepositives:
  - An administrator refreshing certificate trust lists from an explicit URL
level: medium
